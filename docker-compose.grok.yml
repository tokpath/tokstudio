# grok 预览 overlay（Atlas 落地）：
# - 独立 compose 项目 tokstudio-grok，卷/默认网络与 test 栈隔离
# - 宿主机 80/443 仍由 nova/gashub Caddy 占用；本栈 edge 只在内网听 HTTP
# - 公网入口是 https://grok.tokpath.com，由 nova Caddy 终止 TLS 再反代到 tokstudio-grok-edge
# - 禁止与 /root/workspace/tokstudio 的 test 栈共用检出或项目名
# - Bifrost 继续继承基础 compose 的 TOKENHUB_BIFROST_SANDBOX=true，不要在此强制写入 GEMINI Key
name: tokstudio-grok

services:
  edge:
    container_name: tokstudio-grok-edge
    ports:
      - "${TOKENHUB_EDGE_HTTP_PORT:-9180}:80"
      - "${TOKENHUB_EDGE_HTTPS_PORT:-9543}:443"
    networks:
      default: {}
      gashub:
        aliases:
          - tokstudio-grok-edge
    volumes:
      - ./deploy/Caddyfile.preview:/etc/caddy/Caddyfile:ro

  api:
    environment:
      TOKENHUB_PUBLIC_BASE_URL: ${TOKENHUB_PUBLIC_BASE_URL:-https://grok.tokpath.com}
      TOKENHUB_WEB_ORIGIN: ${TOKENHUB_WEB_ORIGIN:-https://grok.tokpath.com}
      # grok 默认 Redirect URI；不要在此打开 ALLOW_MOCK。
      TOKENHUB_GOOGLE_REDIRECT_URL: ${TOKENHUB_GOOGLE_REDIRECT_URL:-https://grok.tokpath.com/login/oauth/google}

networks:
  gashub:
    external: true
    name: gashub_gashub
