openapi: 3.1.0
info:
  title: TokenHub M1 Identity
  version: 0.1.0-m1
paths:
  /v1/auth/register:
    post:
      summary: Email password register with immutable promotion attribution
  /v1/auth/login:
    post:
      summary: Password login, sets HttpOnly session cookie
  /v1/auth/google/status:
    get:
      summary: Whether Google OAuth triad is configured; unavailable when incomplete (mock removed)
  /v1/auth/google/start:
    get:
      summary: Start Google OAuth, stash promotion code; real Google URL when triad is present
  /v1/auth/google/callback:
    post:
      summary: Finish Google OAuth with real token/profile exchange when triad is present; HttpOnly cookie
  /v1/auth/logout:
    post:
      summary: Revoke the current session token and clear the HttpOnly cookie
  /v1/me:
    get:
      summary: Current user
    patch:
      summary: Update display name and locale; channel stays immutable
  /v1/me/password:
    post:
      summary: Change password with the current password
  /v1/me/channel/switch:
    post:
      summary: Always denied
  /v1/public/brand:
    get:
      summary: Brand theme by host
  /v1/public/brand-assets/{id}:
    get:
      summary: Public brand asset bytes without signed URL
  /admin/brands:
    post:
      summary: Create OEM brand with name domains and theme
  /admin/brands/{id}:
    get:
      summary: Read one brand
    patch:
      summary: Update brand name theme or domains
  /admin/brands/{id}/assets:
    post:
      summary: Upload logo favicon or og image with size gates
  /channel/brand:
    get:
      summary: Current channel brand
    patch:
      summary: OEM channel updates name and theme
  /channel/brand/assets:
    post:
      summary: OEM channel uploads brand assets
  /v1/public/models:
    get:
      summary: Brand-scoped published models without Provider slugs
      parameters:
        - name: vendor
          in: query
          schema:
            type: string
        - name: kind
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - name: id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
  /channel/users:
    get:
      summary: Channel-scoped user list
  /channel/attribution:
    get:
      summary: Channel-scoped attribution buckets by promotion code
  /admin/users/{id}/ban:
    post:
      summary: Ban a user, reject login and API keys, hold unsettled commission
  /admin/users/{id}/unban:
    post:
      summary: Restore an active user and release held commission
  /admin/users/{id}/attribution:
    post:
      summary: Platform admin changes unique attribution with reason and confirm
