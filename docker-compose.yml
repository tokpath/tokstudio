services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tokenhub
      POSTGRES_PASSWORD: tokenhub
      POSTGRES_DB: tokenhub
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f
      - -c
      - archive_timeout=60
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokenhub -d tokenhub"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - tokenhub_pg:/var/lib/postgresql/data
      - tokenhub_wal:/var/lib/postgresql/wal_archive

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: tokenhub
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  api:
    build:
      context: ./backend
    environment:
      TOKENHUB_ENV: development
      TOKENHUB_HTTP_ADDR: :8080
      TOKENHUB_DATABASE_URL: postgres://tokenhub:tokenhub@postgres:5432/tokenhub?sslmode=disable
      TOKENHUB_REDIS_URL: redis://redis:6379/0
      TOKENHUB_BOOTSTRAP_ADMIN_TOKEN: ${TOKENHUB_BOOTSTRAP_ADMIN_TOKEN:-dev_admin_change_me}
      TOKENHUB_BOOTSTRAP_USER_TOKEN: ${TOKENHUB_BOOTSTRAP_USER_TOKEN:-dev_user_change_me}
      TOKENHUB_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      TOKENHUB_OTEL_SERVICE_NAME: tokenhub-api
      TOKENHUB_WEB_ORIGIN: http://localhost:3000
      TOKENHUB_LOG_LEVEL: info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    entrypoint: ["/worker"]
    environment:
      TOKENHUB_ENV: development
      TOKENHUB_DATABASE_URL: postgres://tokenhub:tokenhub@postgres:5432/tokenhub?sslmode=disable
      TOKENHUB_REDIS_URL: redis://redis:6379/0
      TOKENHUB_OTEL_SERVICE_NAME: tokenhub-worker
      TOKENHUB_LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

  edge:
    image: caddy:2.8-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - tokenhub_caddy:/data
    environment:
      TOKENHUB_EDGE_CNAME: edge.tokenhub.local
    depends_on:
      - api
      - web

volumes:
  tokenhub_pg:
  tokenhub_wal:
  tokenhub_caddy:
