# Fresh operator-v2 volumes keep the rebuilt schema separate from old data.
# No service performs legacy migrations or creates fake customers/models/merchants.
x-application-env: &application-env
  TOKENHUB_ENV: ${TOKENHUB_ENV:-development}
  TOKENHUB_HTTP_ADDR: :8080
  TOKENHUB_WORKER_HTTP_ADDR: :8081
  TOKENHUB_METRICS_TOKEN: ${TOKENHUB_METRICS_TOKEN:-tokenhub-local-metrics-only}
  TOKENHUB_OFFICIAL_HOST: ${TOKENHUB_OFFICIAL_HOST:-localhost}
  TOKENHUB_PUBLIC_BASE_URL: ${TOKENHUB_PUBLIC_BASE_URL:-http://localhost:9080}
  TOKENHUB_WEB_ORIGIN: ${TOKENHUB_WEB_ORIGIN:-http://localhost:9080}
  TOKENHUB_DATABASE_URL: postgres://tokenhub:${TOKENHUB_POSTGRES_PASSWORD:-tokenhub}@postgres:5432/tokenhub_v2?sslmode=disable
  TOKENHUB_REDIS_URL: redis://redis:6379/0
  TOKENHUB_APP_KEY: ${TOKENHUB_APP_KEY:-}
  TOKENHUB_ENCRYPTION_KEY: ${TOKENHUB_APP_KEY:-}
  TOKENHUB_S3_ENDPOINT: http://minio:9000
  TOKENHUB_S3_BUCKET: ${TOKENHUB_S3_BUCKET:-tokenhub-v2}
  TOKENHUB_S3_REGION: ${TOKENHUB_S3_REGION:-us-east-1}
  TOKENHUB_S3_ACCESS_KEY: ${TOKENHUB_S3_ACCESS_KEY:-minioadmin}
  TOKENHUB_S3_SECRET_KEY: ${TOKENHUB_S3_SECRET_KEY:-minioadmin}
  TOKENHUB_S3_FORCE_PATH_STYLE: "true"
  TOKENHUB_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  TOKENHUB_LOG_LEVEL: info

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tokenhub
      POSTGRES_PASSWORD: ${TOKENHUB_POSTGRES_PASSWORD:-tokenhub}
      POSTGRES_DB: tokenhub_v2
    command: ["postgres", "-c", "wal_level=replica", "-c", "archive_mode=off", "-c", "max_wal_size=512MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokenhub -d tokenhub_v2"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - tokenhub_v2_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - tokenhub_v2_redis:/data

  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${TOKENHUB_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${TOKENHUB_S3_SECRET_KEY:-minioadmin}
    volumes:
      - tokenhub_v2_minio:/data

  minio-init:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    depends_on: [minio]
    environment:
      TOKENHUB_S3_ACCESS_KEY: ${TOKENHUB_S3_ACCESS_KEY:-minioadmin}
      TOKENHUB_S3_SECRET_KEY: ${TOKENHUB_S3_SECRET_KEY:-minioadmin}
      TOKENHUB_S3_BUCKET: ${TOKENHUB_S3_BUCKET:-tokenhub-v2}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        export MC_HOST_local="http://$${TOKENHUB_S3_ACCESS_KEY}:$${TOKENHUB_S3_SECRET_KEY}@minio:9000"
        ready=0
        for n in $$(seq 1 60); do
          if mc ready local >/dev/null 2>&1; then ready=1; break; fi
          sleep 1
        done
        test "$$ready" = 1
        mc mb -p "local/$${TOKENHUB_S3_BUCKET}"
        mc anonymous set none "local/$${TOKENHUB_S3_BUCKET}"

  migrate:
    # api、worker、migrate 共用这一次编译结果，避免同一次部署把后端编三遍。
    image: &backend-image tokenhub-backend:${TOKENHUB_BACKEND_TAG:-local}
    build: &backend-build ./backend
    entrypoint: ["/migrate"]
    env_file: [.env]
    environment: *application-env
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

  api:
    image: *backend-image
    build: *backend-build
    env_file: [.env]
    environment: *application-env
    healthcheck:
      test: ["CMD", "/api", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  worker:
    image: *backend-image
    build: *backend-build
    entrypoint: ["/worker"]
    env_file: [.env]
    environment: *application-env
    healthcheck:
      test: ["CMD", "/worker", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  web:
    build: ./web
    environment:
      TOKENHUB_API_INTERNAL_URL: http://api:8080
    depends_on: [api]

  edge:
    image: caddy:2.8-alpine
    ports:
      - "${TOKENHUB_EDGE_HTTP_PORT:-9080}:80"
      - "${TOKENHUB_EDGE_HTTPS_PORT:-9443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - tokenhub_v2_caddy:/data
    environment:
      TOKENHUB_ACME_EMAIL: ${TOKENHUB_ACME_EMAIL:-ops@example.test}
    depends_on: [api, web]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro
  prometheus:
    image: prom/prometheus:v3
    environment:
      TOKENHUB_METRICS_TOKEN: ${TOKENHUB_METRICS_TOKEN:-tokenhub-local-metrics-only}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        printf '%s' "$${TOKENHUB_METRICS_TOKEN}" > /tmp/tokenhub-metrics-token
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [api, worker]
  grafana:
    image: grafana/grafana:13.1.4
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${TOKENHUB_GRAFANA_PASSWORD:-tokenhub-local-only}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]
  backup:
    profiles: ["backup"]
    build:
      context: ./backend
      target: backup
    env_file: [.env]
    environment:
      <<: *application-env
      TOKENHUB_BACKUP_KEY: ${TOKENHUB_BACKUP_KEY:-}
      TOKENHUB_BACKUP_DIR: /backups
      TOKENHUB_BACKUP_INTERVAL_SECONDS: ${TOKENHUB_BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./scripts/backup_loop.sh:/backup_loop.sh:ro
      - tokenhub_v2_offsite:/backups
    entrypoint: ["/bin/sh", "/backup_loop.sh"]
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
  pebble:
    image: ghcr.io/letsencrypt/pebble:2.6.0
    profiles: ["tls-test"]
    command: ["-config", "/test/config/pebble-config.json"]
    environment:
      PEBBLE_VA_ALWAYS_VALID: "1"
      PEBBLE_VA_NOSLEEP: "1"
      PEBBLE_WFE_NONCEREJECT: "0"

volumes:
  tokenhub_v2_pg:
  tokenhub_v2_redis:
  tokenhub_v2_minio:
  tokenhub_v2_caddy:
  tokenhub_v2_offsite:
