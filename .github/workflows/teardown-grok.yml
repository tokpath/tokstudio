# 一次性 / 可重复拆除 https://grok.tokpath.com 预览栈。
# 不触碰 release → https://test.tokpath.com。
# 需要仓库 Secret：ALIYUN_HOST、TOKEN_DEPLOY_SSH_KEY。
name: teardown-grok

on:
  workflow_dispatch:
  push:
    branches: [cursor/remove-grok-tokpath-27f5]

concurrency:
  group: teardown-grok
  cancel-in-progress: false

jobs:
  teardown:
    runs-on: ubuntu-latest
    steps:
      - name: Require ALIYUN_HOST secret
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
        run: |
          if [ -z "$ALIYUN_HOST" ]; then
            echo "Set repository Secret ALIYUN_HOST before teardown." >&2
            exit 1
          fi
      - name: SSH to host and tear down grok preview
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: root
          key: ${{ secrets.TOKEN_DEPLOY_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            GROK_ROOT=/root/workspace/tokstudio-grok
            TEST_ROOT=/root/workspace/tokstudio
            if [ "$GROK_ROOT" = "$TEST_ROOT" ]; then
              echo "refusing: grok and test checkout paths collide" >&2
              exit 1
            fi
            # 优先用独立检出里的脚本；若检出已删，则从本仓库临时拉一份最小 teardown。
            if [ -x "$GROK_ROOT/scripts/teardown_grok.sh" ]; then
              bash "$GROK_ROOT/scripts/teardown_grok.sh"
            elif [ -x "$TEST_ROOT/scripts/teardown_grok.sh" ]; then
              bash "$TEST_ROOT/scripts/teardown_grok.sh"
            else
              # 内联最小拆除：停项目、删 Caddy 块、删检出。
              COMPOSE_PROJECT=tokstudio-grok
              NOVA_CADDY=/root/workspace/nova/Caddyfile
              docker compose -p "$COMPOSE_PROJECT" down --remove-orphans 2>/dev/null || true
              docker ps -a --format '{{.Names}}' | grep -E '^tokstudio-grok' | while read -r name; do
                docker rm -f "$name" >/dev/null 2>&1 || true
              done
              if [ -f "$NOVA_CADDY" ] && grep -qF 'grok.tokpath.com' "$NOVA_CADDY"; then
                python3 - <<'PY'
            from pathlib import Path
            import re
            path = Path("/root/workspace/nova/Caddyfile")
            text = path.read_text()
            new_text, n = re.subn(
                r"\n*grok\.tokpath\.com\s*\{(?:[^{}]|\{[^{}]*\})*\}\n*",
                "\n",
                text,
                count=1,
            )
            if n == 0:
                lines = text.splitlines(True)
                out = []
                skipping = False
                depth = 0
                for line in lines:
                    if not skipping and "grok.tokpath.com" in line and "{" in line:
                        skipping = True
                        depth = line.count("{") - line.count("}")
                        continue
                    if skipping:
                        depth += line.count("{") - line.count("}")
                        if depth <= 0:
                            skipping = False
                        continue
                    out.append(line)
                new_text = "".join(out)
            path.write_text(new_text.rstrip() + "\n")
            PY
                if grep -qF 'grok.tokpath.com' "$NOVA_CADDY"; then
                  echo "grok.tokpath.com still in Caddyfile" >&2
                  exit 1
                fi
                if docker ps --format '{{.Names}}' | grep -qx caddy; then
                  docker exec caddy caddy validate --config /etc/caddy/Caddyfile
                  docker exec caddy caddy reload --config /etc/caddy/Caddyfile
                fi
              fi
              rm -rf "$GROK_ROOT"
              echo "inline grok teardown complete"
            fi
            # 探活：grok Host 不应再命中 TokenHub healthz（允许连接失败或非 200）。
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 -H 'Host: grok.tokpath.com' http://127.0.0.1/healthz || true)"
            echo "post-teardown Host:grok.tokpath.com /healthz => ${code:-curl-failed}"
            if curl -fsS --max-time 5 -H 'Host: test.tokpath.com' http://127.0.0.1/healthz >/dev/null; then
              echo "test.tokpath.com healthz still ok"
            else
              echo "warning: test.tokpath.com healthz not ready (may be unrelated)" >&2
            fi
