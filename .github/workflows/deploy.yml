# 只有合入 release/v0.1.0（push 到该分支）且 CI 全绿，才会更新 https://test.tokpath.com。
# PR、cursor/**、main、手动 Run workflow 都不会部署。
# Atlas 编排本流水线；concurrency 组 deploy-token，不会与 deploy-grok 互相取消。
# 需要仓库 Secret：ALIYUN_HOST（SSH 主机，Settings → Secrets and variables → Actions → Secrets）。
# 需要仓库 Secret：TOKEN_DEPLOY_SSH_KEY。
# 不要把主机写成字面 IP；也不要用 vars.ALIYUN_HOST。
name: deploy-token

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [release/v0.1.0]

concurrency:
  group: deploy-token
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'release/v0.1.0' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Require ALIYUN_HOST secret
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
        run: |
          if [ -z "$ALIYUN_HOST" ]; then
            echo "Set repository Secret ALIYUN_HOST before deploying." >&2
            exit 1
          fi
      - name: SSH to token and deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: root
          key: ${{ secrets.TOKEN_DEPLOY_SSH_KEY }}
          command_timeout: 40m
          script: |
            set -euo pipefail
            ROOT=/root/workspace/tokstudio
            BRANCH=release/v0.1.0
            if [ ! -d "$ROOT/.git" ]; then
              git clone --branch "$BRANCH" git@github.com:tokpath/tokstudio.git "$ROOT"
            fi
            cd "$ROOT"
            git fetch origin
            git checkout "$BRANCH"
            git pull --ff-only origin "$BRANCH"
            bash scripts/deploy_token.sh
