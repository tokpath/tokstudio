name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tokenhub
          POSTGRES_PASSWORD: tokenhub
          POSTGRES_DB: tokenhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tokenhub -d tokenhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: test
        env:
          TOKENHUB_DATABASE_URL: postgres://tokenhub:tokenhub@localhost:5432/tokenhub?sslmode=disable
          TOKENHUB_REDIS_URL: redis://localhost:6379/0
          TOKENHUB_BOOTSTRAP_ADMIN_TOKEN: ci_admin_token
          TOKENHUB_BOOTSTRAP_USER_TOKEN: ci_user_token
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test
      - run: npm run build
