# 只读诊断：SSH 到 token 预览机，检查 Google OAuth .env 形态（不打印 secret）。
# 手动 Run workflow；不改代码、不部署、不写 .env。
name: diagnose-google-oauth

on:
  workflow_dispatch:

concurrency:
  group: diagnose-google-oauth
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Require ALIYUN_HOST secret
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
        run: |
          if [ -z "$ALIYUN_HOST" ]; then
            echo "Set repository Secret ALIYUN_HOST before diagnosing." >&2
            exit 1
          fi
      - name: SSH and inspect Google OAuth env shape
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: root
          key: ${{ secrets.TOKEN_DEPLOY_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            ROOT=/root/workspace/tokstudio
            cd "$ROOT"
            echo "=== host pwd ==="
            pwd
            echo "=== git head ==="
            git rev-parse --short HEAD
            git log -1 --oneline
            echo "=== .env google keys (values redacted) ==="
            if [[ ! -f .env ]]; then
              echo "MISSING_ENV_FILE"
              exit 2
            fi
            python3 - <<'PY'
            from pathlib import Path
            import re
            text = Path(".env").read_text(encoding="utf-8", errors="replace")
            keys = {
                "TOKENHUB_GOOGLE_CLIENT_ID",
                "TOKENHUB_GOOGLE_CLIENT_SECRET",
                "TOKENHUB_GOOGLE_REDIRECT_URL",
            }
            found = {}
            for line in text.splitlines():
                s = line.strip()
                if not s or s.startswith("#") or "=" not in s:
                    continue
                k, _, v = s.partition("=")
                k = k.strip()
                if k in keys:
                    found[k] = v
            for k in sorted(keys):
                raw = found.get(k)
                if raw is None:
                    print(f"{k}=MISSING")
                    continue
                v = raw.strip()
                quoted = len(v) >= 2 and ((v[0] == v[-1] == '"') or (v[0] == v[-1] == "'"))
                if quoted:
                    v = v[1:-1].strip()
                if k.endswith("SECRET"):
                    print(
                        f"{k}=set len={len(v)} looks_web={v.startswith('GOCSPX-')} "
                        f"had_wrapping_quotes={quoted} has_space={any(ch.isspace() for ch in v)} "
                        f"prefix={v[:6]+'…' if len(v)>=6 else 'short'}"
                    )
                elif k.endswith("CLIENT_ID"):
                    print(
                        f"{k}=set len={len(v)} had_wrapping_quotes={quoted} "
                        f"suffix={v[-40:] if len(v)>=40 else v}"
                    )
                else:
                    print(f"{k}={v!r} had_wrapping_quotes={quoted}")
            PY
            echo "=== container env shape (api) ==="
            API_CID=$(docker compose -f docker-compose.yml -f docker-compose.token.yml ps -q api || true)
            if [[ -z "${API_CID}" ]]; then
              echo "API_CONTAINER_MISSING"
            else
              docker exec "$API_CID" sh -c '
                for k in TOKENHUB_GOOGLE_CLIENT_ID TOKENHUB_GOOGLE_CLIENT_SECRET TOKENHUB_GOOGLE_REDIRECT_URL; do
                  eval "v=\$$k"
                  if [ -z "$v" ]; then
                    echo "$k=EMPTY"
                  elif [ "$k" = TOKENHUB_GOOGLE_CLIENT_SECRET ]; then
                    case "$v" in
                      GOCSPX-*) web=true ;;
                      *) web=false ;;
                    esac
                    echo "$k=set len=${#v} looks_web=$web"
                  elif [ "$k" = TOKENHUB_GOOGLE_CLIENT_ID ]; then
                    echo "$k=set suffix=$(printf %s "$v" | tail -c 40)"
                  else
                    echo "$k=$v"
                  fi
                done
              '
              echo "=== recent api google logs ==="
              docker compose -f docker-compose.yml -f docker-compose.token.yml logs --no-color --tail=120 api 2>/dev/null \
                | grep -E 'api_starting|google_|invalid_client|oauth' || echo "(no matching log lines)"
            fi
            echo "=== live status ==="
            curl -fsS https://test.tokpath.com/v1/auth/google/status || true
            echo
            echo "=== fake-code callback (expect invalid_client or invalid_grant) ==="
            START=$(curl -fsS https://test.tokpath.com/v1/auth/google/start)
            STATE=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])' <<<"$START")
            curl -sS -D- -o /tmp/cb.json -X POST https://test.tokpath.com/v1/auth/google/callback \
              -H 'Content-Type: application/json' \
              -d "{\"state\":\"$STATE\",\"code\":\"4/fake-diagnose\"}" | head -20
            echo
            cat /tmp/cb.json
            echo
