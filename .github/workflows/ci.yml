name: ci

on:
  push:
    branches: [main, release/v0.1.0, feature/grokbot, "cursor/**"]
  pull_request:

jobs:
  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assert deploy host + grok/test isolation
        run: bash scripts/assert_deploy_isolation.sh

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tokenhub
          POSTGRES_PASSWORD: tokenhub
          POSTGRES_DB: tokenhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tokenhub -d tokenhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum
      - name: download modules
        run: |
          # proxy.golang.org 偶发 HTTP/2 INTERNAL_ERROR；先下全模块再测，避免编译期再打网。
          n=0
          until go mod download; do
            n=$((n + 1))
            if [ "$n" -ge 4 ]; then
              exit 1
            fi
            sleep $((n * 4))
          done
      - name: test
        env:
          TOKENHUB_DATABASE_URL: postgres://tokenhub:tokenhub@localhost:5432/tokenhub?sslmode=disable
          TOKENHUB_REDIS_URL: redis://localhost:6379/0
          TOKENHUB_BOOTSTRAP_ADMIN_TOKEN: ci_admin_token
          TOKENHUB_BOOTSTRAP_USER_TOKEN: ci_user_token
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
