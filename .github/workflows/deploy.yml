# 普通 push / CI 完成事件不发布；只允许人工选择已通过 CI 的完整提交。
# 保留 test 栈、主机 Secret 和独立 concurrency。实际发布须完成产品验收与隔离新库配置。
name: deploy-token

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "release/v0.1.0 上通过 CI 的完整 40 位提交 SHA"
        type: string
        required: true
      confirmation:
        description: "确认已完成验收、隔离新库及恢复准备；输入 DEPLOY_TEST"
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-token
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/release/v0.1.0'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.1.0
          fetch-depth: 0
      - name: Validate explicit release target
        id: target
        env:
          DEPLOY_SHA: ${{ inputs.commit_sha }}
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_CONFIRMATION" == "DEPLOY_TEST" ]]
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/release/v0.1.0
          echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
      - name: Require successful CI for exact commit
        uses: actions/github-script@v7
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
        with:
          script: |
            const {data} = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'ci.yml',
              branch: 'release/v0.1.0',
              event: 'push',
              head_sha: process.env.DEPLOY_SHA,
              per_page: 100
            });
            const runs = data.workflow_runs.filter(run => run.head_sha === process.env.DEPLOY_SHA);
            runs.sort((a, b) => b.run_number - a.run_number || b.run_attempt - a.run_attempt);
            if (!runs.length || runs[0].status !== 'completed' || runs[0].conclusion !== 'success') {
              core.setFailed('Selected commit must have a completed successful CI run.');
            }

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: tokenhub-test
      url: https://test.tokpath.com
    steps:
      - name: Require ALIYUN_HOST secret
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
        run: |
          if [ -z "$ALIYUN_HOST" ]; then
            echo "Set repository Secret ALIYUN_HOST before deploying." >&2
            exit 1
          fi
      - name: SSH to token and deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: root
          key: ${{ secrets.TOKEN_DEPLOY_SSH_KEY }}
          command_timeout: 40m
          script: |
            set -euo pipefail
            # 磁盘耗尽时 git fetch 也会失败，因此先清理可重建缓存与悬空镜像。
            df -h /root/workspace
            docker builder prune -af >/dev/null
            docker image prune -af >/dev/null
            df -h /root/workspace
            if [ "$(df -Pk /root/workspace | awk 'NR == 2 { print $4 }')" -lt 3145728 ]; then
              docker system df -v
              docker buildx ls
              docker buildx du
              (du -x -h --max-depth=2 /var /root /tmp 2>/dev/null || true) | sort -h | tail -n 30
              (du -x -h --max-depth=3 /var/lib/docker/volumes /var/lib/containerd 2>/dev/null || true) | sort -h | tail -n 25
              journalctl --disk-usage || true
              echo "Less than 3 GiB available; inspect disk usage before building." >&2
            fi
            ROOT=/root/workspace/tokstudio
            BRANCH=release/v0.1.0
            if [ ! -d "$ROOT/.git" ]; then
              git clone --branch "$BRANCH" git@github.com:tokpath/tokstudio.git "$ROOT"
            fi
            cd "$ROOT"
            git fetch origin "$BRANCH"
            test -z "$(git status --porcelain --untracked-files=no)"
            DEPLOY_SHA='${{ needs.validate.outputs.sha }}'
            git merge-base --is-ancestor "$DEPLOY_SHA" "origin/$BRANCH"
            git checkout --detach "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            bash scripts/deploy_token.sh
