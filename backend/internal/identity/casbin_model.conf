# TokenHub 功能权限模型：角色 × 路径 × HTTP 方法。
# 数据范围（本渠道 / 自己的订单 / 推广下线）仍由 handler 过滤，不放进 Casbin。
[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = r.sub == p.sub && keyMatch2(r.obj, p.obj) && (r.act == p.act || p.act == "*")
