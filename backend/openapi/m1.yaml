openapi: 3.1.0
info:
  title: TokenHub M1 Identity
  version: 0.1.0-m1
paths:
  /v1/auth/register:
    post:
      summary: Brand-scoped email password registration with immutable promotion attribution
  /v1/auth/login:
    post:
      summary: Password login within the authenticated host's brand; sets host-only HttpOnly session cookie
  /v1/auth/email/status:
    get:
      summary: Transactional email availability without disclosing SMTP credentials
  /v1/auth/password/forgot:
    post:
      summary: Queue a brand-scoped password reset email; generic response and cooldown for all addresses
  /v1/auth/password/reset:
    post:
      summary: Consume a one-use 30-minute email token, update password and revoke login sessions
  /v1/auth/email/verification/request:
    post:
      summary: Queue a one-use 24-hour verification email; generic response
  /v1/auth/email/verify:
    post:
      summary: Verify the email snapshot for the token's user within the current brand
  /v1/me/email/verification:
    post:
      summary: Resend the current user's verification email
  /v1/auth/google/status:
    get:
      summary: Google availability for the current brand and verified callback origin
  /v1/auth/google/start:
    get:
      summary: Start Google OAuth using brand credentials; bind state to brand, callback, config version and browser
  /v1/auth/google/callback:
    post:
      summary: Finish brand-scoped Google OAuth; test callbacks verify configuration without issuing customer sessions
  /v1/auth/logout:
    post:
      summary: Revoke the current session token and clear the HttpOnly cookie
  /v1/me:
    get:
      summary: Current user
    patch:
      summary: Update display name and locale; channel stays immutable
  /v1/me/password:
    post:
      summary: Change password with the current password
  /v1/me/channel/switch:
    post:
      summary: Always denied
  /v1/public/brand:
    get:
      summary: Brand theme by host
  /v1/public/brand-assets/{id}:
    get:
      summary: Public brand asset bytes without signed URL
  /admin/brands:
    post:
      summary: Create OEM brand with name domains and theme
  /admin/brands/{id}:
    get:
      summary: Read one brand
    patch:
      summary: Update brand name theme or domains
  /admin/brands/{id}/assets:
    post:
      summary: Upload logo favicon or og image with size gates
  /channel/brand:
    get:
      summary: Current channel brand
    patch:
      summary: OEM channel updates name and theme
  /channel/brand/assets:
    post:
      summary: OEM channel uploads brand assets
  /v1/public/models:
    get:
      summary: Brand-scoped published models without Provider slugs
      parameters:
        - name: vendor
          in: query
          schema:
            type: string
        - name: kind
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - name: id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
  /channel/users:
    get:
      summary: Channel-scoped user list
  /channel/attribution:
    get:
      summary: Channel-scoped attribution buckets by promotion code
  /admin/users/{id}/ban:
    post:
      summary: Ban a user, reject login and API keys, hold unsettled commission
  /admin/users/{id}/unban:
    post:
      summary: Restore an active user and release held commission
  /admin/users/{id}/attribution:
    post:
      summary: Platform admin changes unique attribution with reason and confirm
