# Release push CI 成功后自动发布同一提交；保留人工精确 SHA 恢复入口。
# 本工作流须保留在默认分支（当前 release/v0.1.0），workflow_run 才会触发。
name: deploy-token

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [release/v0.1.0]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "release/v0.1.0 上通过 CI 的完整 40 位提交 SHA"
        type: string
        required: true
      confirmation:
        description: "确认已完成验收、隔离新库及恢复准备；输入 DEPLOY_TEST"
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-token
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/v0.1.0') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'release/v0.1.0' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      deploy: ${{ steps.target.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.1.0
          fetch-depth: 0
      - name: Select exact successful CI commit
        id: target
        uses: actions/github-script@v7
        with:
          script: |
            const validate = require('./scripts/deployment-target.cjs');
            await validate({github, context, core});
      - name: Require release ancestry
        if: steps.target.outputs.deploy == 'true'
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/release/v0.1.0

  deploy:
    needs: validate
    if: needs.validate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: tokenhub-test
      url: https://test.tokpath.com
    steps:
      - name: Require ALIYUN_HOST secret
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
        run: |
          if [ -z "$ALIYUN_HOST" ]; then
            echo "Set repository Secret ALIYUN_HOST before deploying." >&2
            exit 1
          fi
      - name: SSH to token and deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: root
          key: ${{ secrets.TOKEN_DEPLOY_SSH_KEY }}
          command_timeout: 40m
          script: |
            set -euo pipefail
            # 磁盘耗尽时 git fetch 也会失败，因此先清理可重建缓存与悬空镜像。
            df -h /root/workspace
            docker builder prune -af >/dev/null
            docker image prune -af >/dev/null
            df -h /root/workspace
            if [ "$(df -Pk /root/workspace | awk 'NR == 2 { print $4 }')" -lt 3145728 ]; then
              docker system df -v
              docker buildx ls
              docker buildx du
              (du -x -h --max-depth=2 /var /root /tmp 2>/dev/null || true) | sort -h | tail -n 30
              (du -x -h --max-depth=3 /var/lib/docker/volumes /var/lib/containerd 2>/dev/null || true) | sort -h | tail -n 25
              journalctl --disk-usage || true
              echo "Less than 3 GiB available; inspect disk usage before building." >&2
            fi
            ROOT=/root/workspace/tokstudio
            BRANCH=release/v0.1.0
            if [ ! -d "$ROOT/.git" ]; then
              git clone --branch "$BRANCH" git@github.com:tokpath/tokstudio.git "$ROOT"
            fi
            cd "$ROOT"
            git fetch origin "$BRANCH"
            test -z "$(git status --porcelain --untracked-files=no)"
            DEPLOY_SHA='${{ needs.validate.outputs.sha }}'
            git merge-base --is-ancestor "$DEPLOY_SHA" "origin/$BRANCH"
            # A newer push may arrive while this workflow waits for the host.
            if [ '${{ github.event_name }}' = workflow_run ] && [ "$DEPLOY_SHA" != "$(git rev-parse "origin/$BRANCH")" ]; then
              echo 'Newer release commit exists; skipping superseded automatic deployment.'
              exit 0
            fi
            git checkout --detach "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            bash scripts/deploy_token.sh
