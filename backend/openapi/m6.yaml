openapi: 3.0.3
info:
  title: TokenHub M6 Commission
  version: 0.1.0-m6
paths:
  /v1/partner/me:
    get:
      summary: Current agent/KOL role and downline scope
  /v1/partner/users:
    get:
      summary: Scoped users for agent/KOL. Emails are masked.
  /v1/partner/commissions:
    get:
      summary: Commission entries in the caller's role tree. No prompts.
  /v1/partner/export:
    get:
      summary: CSV of commission amounts only
  /admin/commissions:
    get:
      summary: Platform commission ledger
  /admin/commissions/unfreeze:
    post:
      summary: Move frozen entries to available after 7 days or for sandbox
  /admin/commissions/settle:
    post:
      summary: Monthly settlement batch
  /admin/settlements/{id}/payout:
    post:
      summary: Manual payout
  /channel/quota:
    get:
      summary: Channel usd_credit remaining plus issued/consumed totals and issue_ratio_bps
  /channel/allocations:
    get:
      summary: Service quotas issued from this channel using the platform issue ratio
  /admin/channel-quotas/grant:
    post:
      summary: Grant or reclaim channel usd_credit quota
  /admin/channel-quotas/{channel_id}:
    get:
      summary: Channel quota including issue_ratio_bps
  /admin/channel-quotas/{channel_id}/issue-rule:
    get:
      summary: Topup-to-quota issue ratio. Default 10000 BPS = 1:1. Channel admin is read-only for own channel.
    patch:
      summary: Update issue ratio. Platform/finance only. Requires X-Tokenhub-Confirm.
  /admin/commission-policy:
    get:
      summary: Active platform commission policy
    patch:
      summary: Update commission BPS and freeze days. Requires X-Tokenhub-Confirm.
