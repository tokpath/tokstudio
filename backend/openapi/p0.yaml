openapi: 3.0.3
info:
  title: TokenHub P0
  version: 0.1.0-m7
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: getHealthz
      responses:
        "200":
          description: ok
  /admin/ops/dashboard:
    get:
      operationId: getAdminDashboard
      responses:
        "200":
          description: dashboard
  /admin/metrics:
    get:
      operationId: getAdminMetrics
      parameters:
        - name: dimension
          in: query
          schema:
            type: string
      responses:
        "200":
          description: metrics
  /admin/metrics/series:
    get:
      operationId: getAdminMetricsSeries
      parameters:
        - name: days
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: daily time series
  /admin/metrics/daily:
    get:
      operationId: getAdminMetricsDaily
      parameters:
        - name: days
          in: query
          schema:
            type: integer
        - name: format
          in: query
          schema:
            type: string
      responses:
        "200":
          description: daily summary or csv
  /admin/providers:
    get:
      operationId: listProviders
      responses:
        "200":
          description: providers
    post:
      operationId: createProvider
      responses:
        "201":
          description: created
  /admin/providers/{id}:
    get:
      operationId: getProvider
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: provider
    patch:
      operationId: patchProvider
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: updated
  /admin/providers/{id}/accounts:
    get:
      operationId: listProviderAccounts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: account pool
    post:
      operationId: addProviderAccount
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: account added
  /admin/providers/{id}/accounts/{aid}:
    patch:
      operationId: patchProviderAccount
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: aid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: account updated
  /admin/models:
    get:
      operationId: listAdminModels
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: sync_state
          in: query
          schema:
            type: string
            enum: [draft, reviewed, rejected, published]
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: models; filter with status and sync_state before pagination
    post:
      operationId: createAdminModel
      responses:
        "201":
          description: created as draft
  /admin/providers/{id}/sync:
    post:
      operationId: syncProvider
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: draft models from provider sync
  /admin/models/review:
    post:
      operationId: reviewAdminModel
      responses:
        "200":
          description: reviewed
  /admin/models/publish:
    post:
      operationId: publishAdminModel
      responses:
        "200":
          description: published
  /admin/models/deprecate:
    post:
      operationId: deprecateAdminModel
      responses:
        "200":
          description: deprecated
  /admin/models/{id}:
    get:
      operationId: getAdminModel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: model
    patch:
      operationId: patchAdminModel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: updated
  /admin/routes:
    get:
      operationId: listAdminRoutes
      responses:
        "200":
          description: routes
    post:
      operationId: createAdminRoute
      responses:
        "201":
          description: created
  /admin/routes/{id}:
    patch:
      operationId: patchAdminRoute
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: updated route strategy or status
  /admin/channels:
    get:
      operationId: listChannels
      responses:
        "200":
          description: channels
    post:
      operationId: createChannel
      responses:
        "201":
          description: created
  /admin/channels/{id}:
    get:
      operationId: getChannel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: one channel tenant
    patch:
      operationId: patchChannel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: updated channel status type or brand; disabled freezes new chat and media with 403 channel_disabled
  /admin/channels/{id}/models:
    get:
      operationId: listChannelModels
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: platform catalog models entitled to this tenant; tenants cannot add providers or models
    patch:
      operationId: patchChannelModels
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: entitle or revoke existing platform catalog models for this tenant; unknown public_id is rejected; tenants cannot create providers or models
  /channel/models:
    get:
      operationId: listOwnChannelModels
      responses:
        "200":
          description: models already entitled to the current tenant; channel admins cannot add providers or models
  /channel/attribution:
    get:
      operationId: listChannelAttribution
      responses:
        "200":
          description: channel attribution buckets
  /channel/plans:
    get:
      operationId: listChannelPlans
      responses:
        "200":
          description: scoped channel and platform plans
    post:
      operationId: createChannelPlan
      responses:
        "201":
          description: channel plan created or pending review
  /channel/brand:
    get:
      operationId: getChannelBrand
      responses:
        "200":
          description: current channel brand
    patch:
      operationId: patchChannelBrand
      responses:
        "200":
          description: brand updated
  /channel/brand/assets:
    post:
      operationId: uploadChannelBrandAsset
      responses:
        "201":
          description: asset stored
  /channel/payments/overview:
    get:
      operationId: getChannelPaymentOverview
      responses:
        "200":
          description: pluggable payment lanes for this channel
  /channel/payments/adapters:
    get:
      operationId: listChannelPaymentAdapters
      responses:
        "200":
          description: registered payment plugins
  /channel/payments/instances:
    get:
      operationId: listChannelPaymentInstances
      responses:
        "200":
          description: merchant instances without secrets
    post:
      operationId: createChannelPaymentInstance
      responses:
        "201":
          description: instance created
  /channel/payments/instances/{id}:
    patch:
      operationId: patchChannelPaymentInstance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: instance updated
  /channel/payments/instances/{id}/test:
    post:
      operationId: testChannelPaymentInstance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: connectivity tested
  /channel/payments/instances/{id}/go-live:
    post:
      operationId: goLiveChannelPaymentInstance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: instance live
  /channel/payments/settings:
    get:
      operationId: getChannelPaymentSettings
      responses:
        "200":
          description: checkout rules
    patch:
      operationId: patchChannelPaymentSettings
      responses:
        "200":
          description: rules saved
  /channel/payments/orders:
    get:
      operationId: listChannelPaymentOrders
      responses:
        "200":
          description: orders for this channel
  /v1/payments/checkout:
    get:
      operationId: getUserPaymentCheckout
      responses:
        "200":
          description: methods resolved from the caller's channel
  /v1/payments/quote:
    get:
      operationId: quoteUserPayment
      responses:
        "200":
          description: dual currency quote using read-only BPS
  /admin/channels/{id}/payments:
    get:
      operationId: getAdminChannelPayments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: readiness lights without secrets
  /admin/channels/{id}/payments/disable:
    post:
      operationId: disableAdminChannelPayments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: emergency disable
  /admin/payment-adapters:
    get:
      operationId: listAdminPaymentAdapters
      responses:
        "200":
          description: plugin catalog and kill switches
  /admin/payment-adapters/{adapter}:
    patch:
      operationId: patchAdminPaymentAdapter
      parameters:
        - name: adapter
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: adapter flag updated
  /channel/quota:
    get:
      operationId: getChannelQuota
      responses:
        "200":
          description: remaining usd_credit plus issued/consumed totals and issue_ratio_bps
  /channel/allocations:
    get:
      operationId: listChannelAllocations
      responses:
        "200":
          description: service quotas issued from this channel using the platform issue ratio
  /channel/pnl:
    get:
      operationId: getChannelPnL
      responses:
        "200":
          description: channel pool PnL
  /channel/supplier-entries:
    get:
      operationId: listChannelSupplier
      responses:
        "200":
          description: supplier spend for the actor's books
    post:
      operationId: createChannelSupplier
      responses:
        "201":
          description: recorded supplier spend
  /channel/supplier-entries/{id}/reverse:
    post:
      operationId: reverseChannelSupplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: reversing row
  /channel/quotas/grant:
    post:
      operationId: grantChannelWholesale
      responses:
        "200":
          description: C transfers credits to a child B
  /channel/commission-policy:
    get:
      operationId: getChannelCommissionPolicy
      responses:
        "200":
          description: market commission policy
    patch:
      operationId: patchChannelCommissionPolicy
      responses:
        "200":
          description: C updates own commission policy
  /channel/eligibility-rules:
    get:
      operationId: getChannelEligibility
      responses:
        "200":
          description: effective eligibility
    patch:
      operationId: patchChannelEligibility
      responses:
        "200":
          description: C updates eligibility
  /v1/partner/me:
    get:
      operationId: getPartnerMe
      responses:
        "200":
          description: partner role and scope
  /v1/partner/users:
    get:
      operationId: listPartnerUsers
      responses:
        "200":
          description: scoped partner users
  /admin/users:
    get:
      operationId: listAdminUsers
      responses:
        "200":
          description: users
  /admin/users/{id}/ban:
    post:
      operationId: banAdminUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: user banned
  /admin/users/{id}/unban:
    post:
      operationId: unbanAdminUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: user restored
  /admin/users/{id}/attribution:
    post:
      operationId: reattributeAdminUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: attribution changed
  /admin/api-keys:
    get:
      operationId: listAdminAPIKeys
      responses:
        "200":
          description: keys without secrets
  /admin/api-keys/{id}/disable:
    post:
      operationId: adminDisableAPIKey
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: key disabled, no secret echoed
  /v1/me/api-keys:
    get:
      operationId: listMyAPIKeys
      responses:
        "200":
          description: keys with allowlist, rpm_limit and optional secret
    post:
      operationId: createAPIKey
      responses:
        "201":
          description: created key with allowlist, rpm_limit and secret
  /v1/me/api-keys/{id}/rotate:
    post:
      operationId: rotateAPIKey
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: new secret
  /v1/me/api-keys/{id}/disable:
    post:
      operationId: disableAPIKey
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: disabled
  /v1/me/api-keys/{id}/copy:
    post:
      operationId: copyAPIKey
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: copy audited
  /v1/public/models:
    get:
      operationId: listPublicModels
      parameters:
        - name: vendor
          in: query
          schema:
            type: string
          description: filter by vendor slug, e.g. z-ai
        - name: kind
          in: query
          schema:
            type: string
            enum: [text, image, video, embedding, audio]
        - name: q
          in: query
          schema:
            type: string
          description: search id, display_name, vendor, description
        - name: id
          in: query
          schema:
            type: string
          description: exact public model id
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: brand-scoped public model cards without providers; includes items, total, and kind/vendor facets
  /v1/public/tls-check:
    get:
      operationId: publicTLSCheck
      parameters:
        - name: domain
          in: query
          schema:
            type: string
      responses:
        "200":
          description: known oem or platform host
        "404":
          description: unknown host
  /v1/me/api-keys/{id}/expire:
    post:
      operationId: expireAPIKey
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: expired
  /v1/me:
    get:
      operationId: getMe
      responses:
        "200":
          description: current user profile
    patch:
      operationId: patchMe
      responses:
        "200":
          description: updated display name and locale
  /v1/me/password:
    post:
      operationId: changeMyPassword
      responses:
        "200":
          description: password changed
  /v1/me/media:
    get:
      operationId: listMyMedia
      responses:
        "200":
          description: current user media jobs
  /v1/videos:
    post:
      operationId: createVideo
      description: task_type/mode t2v|i2v|first_frame|first_last_frame|reference|extend|edit plus duration/resolution/aspect_ratio/fps/generate_audio/images/first_frame/last_frame/reference_video/reference_audio/source_job_id
      responses:
        "202":
          description: session or api key may create a media job
  /v1/videos/{id}/extend:
    post:
      operationId: extendVideo
      responses:
        "202":
          description: extend a completed video owned by the caller
  /admin/models/attach:
    post:
      operationId: attachModelProvider
      responses:
        "200":
          description: provider mapped onto public model
  /admin/media:
    get:
      operationId: listAdminMedia
      responses:
        "200":
          description: media jobs without prompts
  /admin/billing/export:
    get:
      operationId: exportBilling
      responses:
        "200":
          description: csv reconciliation export
  /admin/audit-logs:
    get:
      operationId: listAuditLogs
      responses:
        "200":
          description: audit
  /admin/audit-probes:
    post:
      operationId: createAuditProbe
      responses:
        "201":
          description: sandbox audit probe
  /admin/outbox/stats:
    get:
      operationId: getOutboxStats
      responses:
        "200":
          description: pending published failed counts
  /admin/me:
    get:
      operationId: getAdminMe
      responses:
        "200":
          description: current admin identity and roles
  /admin/me/2fa:
    get:
      operationId: getAdminTOTP
      responses:
        "200":
          description: totp status without secret
  /admin/me/2fa/setup:
    post:
      operationId: setupAdminTOTP
      responses:
        "200":
          description: pending totp
  /admin/me/2fa/enable:
    post:
      operationId: enableAdminTOTP
      responses:
        "200":
          description: totp enabled
  /admin/me/2fa/disable:
    post:
      operationId: disableAdminTOTP
      responses:
        "200":
          description: totp disabled
  /admin/billing/report:
    get:
      operationId: getBillingReport
      responses:
        "200":
          description: money
  /v1/chat/completions:
    post:
      operationId: chatCompletions
      responses:
        "200":
          description: chat
  /admin/subscriptions/{id}/force-period-end:
    post:
      operationId: adminForcePeriodEnd
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: sandbox clock moved, forbidden in production
  /admin/subscriptions/process-renewals:
    post:
      operationId: adminProcessRenewals
      responses:
        "200":
          description: sandbox renewal scan, forbidden in production
  /admin/plans:
    get:
      operationId: listAdminPlans
      responses:
        "200":
          description: plans including pending review
    post:
      operationId: createAdminPlan
      responses:
        "201":
          description: created
  /admin/plans/{id}:
    patch:
      operationId: patchAdminPlan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: archived
  /admin/plans/{id}/review:
    post:
      operationId: reviewAdminPlan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: approved or rejected
  /admin/payments:
    get:
      operationId: listAdminPayments
      responses:
        "200":
          description: payment orders
  /admin/commission-policy:
    get:
      operationId: getCommissionPolicy
      responses:
        "200":
          description: active policy
    patch:
      operationId: patchCommissionPolicy
      responses:
        "200":
          description: updated policy
  /admin/eligibility-rules:
    get:
      operationId: getAdminEligibility
      responses:
        "200":
          description: platform eligibility
    patch:
      operationId: patchAdminEligibility
      responses:
        "200":
          description: updated eligibility
  /admin/supplier-entries:
    get:
      operationId: listAdminSupplier
      responses:
        "200":
          description: supplier spend
    post:
      operationId: createAdminSupplier
      responses:
        "201":
          description: recorded supplier spend
  /admin/supplier-entries/{id}/reverse:
    post:
      operationId: reverseAdminSupplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: reversing row
  /admin/channels/{id}/pnl:
    get:
      operationId: getAdminChannelPnL
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: channel pool PnL
  /admin/price-books:
    get:
      operationId: listAdminPriceBooks
      responses:
        "200":
          description: price versions
    post:
      operationId: publishAdminPriceBook
      responses:
        "200":
          description: published price
  /admin/ops/alerts:
    get:
      operationId: listAdminAlerts
      responses:
        "200":
          description: operational alerts
  /admin/ops/alerts/evaluate:
    post:
      operationId: evaluateAdminAlerts
      responses:
        "200":
          description: evaluated alerts
  /admin/ops/runbooks:
    get:
      operationId: listAdminRunbooks
      responses:
        "200":
          description: incident runbooks
  /admin/refunds:
    post:
      operationId: adminRefund
      responses:
        "200":
          description: refunded charge or topup
  /admin/entitlements/bonus:
    post:
      operationId: grantBonus
      responses:
        "201":
          description: bonus entitlement
  /admin/commissions/unfreeze:
    post:
      operationId: unfreezeCommissions
      responses:
        "200":
          description: unfrozen count
  /admin/commissions/settle:
    post:
      operationId: settleCommissions
      responses:
        "200":
          description: monthly settlements
  /admin/settlements/{id}/payout:
    post:
      operationId: payoutSettlement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: marked paid
  /admin/channel-quotas/grant:
    post:
      operationId: grantChannelQuota
      responses:
        "200":
          description: updated quota
  /admin/channel-quotas/{channel_id}:
    get:
      operationId: getAdminChannelQuota
      parameters:
        - name: channel_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: channel quota including issue_ratio_bps
  /admin/channel-quotas/{channel_id}/issue-rule:
    get:
      operationId: getChannelQuotaIssueRule
      parameters:
        - name: channel_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: topup-to-quota issue ratio; default 10000 BPS = 1:1
    patch:
      operationId: patchChannelQuotaIssueRule
      parameters:
        - name: channel_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: updated issue ratio; platform/finance only, requires confirm
  /admin/providers/{id}/credentials:
    post:
      operationId: rotateProviderCredential
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: credential ref only, never plaintext
  /admin/providers/{id}/health-check:
    post:
      operationId: healthCheckProvider
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: provider health probe
  /admin/ops/backup-drill:
    post:
      operationId: runBackupDrill
      responses:
        "200":
          description: recorded rpo 15 / rto 60 drill
  /admin/ops/drills/payment:
    post:
      operationId: runPaymentDrill
      responses:
        "200":
          description: forged signature rejected
  /admin/ops/drills/media:
    post:
      operationId: runMediaDrill
      responses:
        "200":
          description: force-fail must release reservation
  /admin/ops/drills/tls:
    post:
      operationId: runTLSDrill
      responses:
        "200":
          description: sandbox tls gate passed
  /admin/brands:
    get:
      operationId: listAdminBrands
      responses:
        "200":
          description: brands and tls status
    post:
      operationId: createAdminBrand
      responses:
        "201":
          description: brand created
  /admin/brands/{id}:
    get:
      operationId: getAdminBrand
      parameters:
        - name: id
          in: path
