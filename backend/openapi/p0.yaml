openapi: 3.0.3
info:
  title: TokenHub P0
  version: 0.1.0-m7
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: getHealthz
      responses:
        "200":
          description: ok
  /admin/ops/dashboard:
    get:
      operationId: getAdminDashboard
      responses:
        "200":
          description: dashboard
  /admin/metrics:
    get:
      operationId: getAdminMetrics
      parameters:
        - name: dimension
          in: query
          schema:
            type: string
      responses:
        "200":
          description: metrics
  /admin/metrics/series:
    get:
      operationId: getAdminMetricsSeries
      parameters:
        - name: days
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: daily time series
  /admin/metrics/daily:
    get:
      operationId: getAdminMetricsDaily
      parameters:
        - name: days
          in: query
          schema:
            type: integer
        - name: format
          in: query
          schema:
            type: string
      responses:
        "200":
          description: daily summary or csv
  /admin/providers:
    get:
      operationId: listProviders
      responses:
        "200":
          description: providers
    post:
      operationId: createProvider
      responses:
        "201":
          description: created
  /admin/providers/{id}:
    patch:
      operationId: patchProvider
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: updated
  /admin/providers/{id}/accounts:
    get:
      operationId: listProviderAccounts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: account pool
    post:
      operationId: addProviderAccount
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: account added
  /admin/providers/{id}/accounts/{aid}:
    patch:
      operationId: patchProviderAccount
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: aid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: account updated
  /admin/models:
    get:
      operationId: listAdminModels
      responses:
        "200":
          description: models
    post:
      operationId: createAdminModel
      responses:
        "201":
          description: created
  /admin/providers/{id}/sync:
    post:
      operationId: syncProvider
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: draft models from provider sync
  /admin/models/review:
    post:
      operationId: reviewAdminModel
      responses:
        "200":
          description: reviewed
  /admin/models/publish:
    post:
      operationId: publishAdminModel
      responses:
        "200":
          description: published
  /admin/models/deprecate:
    post:
      operationId: deprecateAdminModel
      responses:
        "200":
          description: deprecated
  /admin/models/{id}:
    patch:
      operationId: patchAdminModel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: updated
  /admin/routes:
    get:
      operationId: listAdminRoutes
      responses:
        "200":
          description: routes
    post:
      operationId: createAdminRoute
      responses:
        "201":
          description: created
  /admin/channels:
    get:
      operationId: listChannels
      responses:
        "200":
          description: channels
    post:
      operationId: createChannel
      responses:
        "201":
          description: created
  /channel/attribution:
    get:
      operationId: listChannelAttribution
      responses:
        "200":
          description: channel attribution buckets
  /v1/partner/me:
    get:
      operationId: getPartnerMe
      responses:
        "200":
          description: partner role and scope
  /v1/partner/users:
    get:
      operationId: listPartnerUsers
      responses:
        "200":
          description: scoped partner users
  /admin/users:
    get:
      operationId: listAdminUsers
      responses:
        "200":
          description: users
  /admin/api-keys:
    get:
      operationId: listAdminAPIKeys
      responses:
        "200":
          description: keys without secrets
  /v1/me/api-keys/{id}/rotate:
    post:
      operationId: rotateAPIKey
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: new secret
  /v1/me/api-keys/{id}/disable:
    post:
      operationId: disableAPIKey
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: disabled
  /v1/me/api-keys/{id}/copy:
    post:
      operationId: copyAPIKey
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: copy audited
  /v1/public/models:
    get:
      operationId: listPublicModels
      responses:
        "200":
          description: brand-scoped public model cards without providers
  /v1/public/tls-check:
    get:
      operationId: publicTLSCheck
      parameters:
        - name: domain
          in: query
          schema:
            type: string
      responses:
        "200":
          description: known oem or platform host
        "404":
          description: unknown host
  /v1/me/api-keys/{id}/expire:
    post:
      operationId: expireAPIKey
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: expired
  /v1/me:
    get:
      operationId: getMe
      responses:
        "200":
          description: current user profile
    patch:
      operationId: patchMe
      responses:
        "200":
          description: updated display name and locale
  /v1/me/password:
    post:
      operationId: changeMyPassword
      responses:
        "200":
          description: password changed
  /v1/me/media:
    get:
      operationId: listMyMedia
      responses:
        "200":
          description: current user media jobs
  /v1/videos:
    post:
      operationId: createVideo
      responses:
        "202":
          description: session or api key may create a media job
  /admin/models/attach:
    post:
      operationId: attachModelProvider
      responses:
        "200":
          description: provider mapped onto public model
  /admin/media:
    get:
      operationId: listAdminMedia
      responses:
        "200":
          description: media jobs without prompts
  /admin/billing/export:
    get:
      operationId: exportBilling
      responses:
        "200":
          description: csv reconciliation export
  /admin/audit-logs:
    get:
      operationId: listAuditLogs
      responses:
        "200":
          description: audit
  /admin/me/2fa/setup:
    post:
      operationId: setupAdminTOTP
      responses:
        "200":
          description: pending totp
  /admin/billing/report:
    get:
      operationId: getBillingReport
      responses:
        "200":
          description: money
  /v1/chat/completions:
    post:
      operationId: chatCompletions
      responses:
        "200":
          description: chat
